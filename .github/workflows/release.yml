---
name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Container Registry
        if: startsWith(github.event.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-ui
      - uses: ./.github/actions/setup-build

      - name: Generate SBOM for ui/
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1.2.0
        with:
          image: ghcr.io/oss-review-toolkit/ort-minimal:latest@sha256:8da0e190af68d710cbf469c22ed1912b2c32cfff0f5de1ff5a87a189de1cfbd0
          project-path: ${{ github.workspace }}/ui
          run: >-
            cache-dependencies,
            analyzer,
            reporter
          report-formats: "CycloneDx"
          ort-cli-report-args: "-O CycloneDX=output.file.formats=json"
      - name: Copy SBOM into ui/
        run: cp "${{ steps.ort.outputs.results-sbom-cyclonedx-json-path }}" ui/ui.cyclonedx.sbom.json

      - name: Setup build
        run: sudo .ci/setup-build.sh
      - name: Run GoReleaser
        run: |
          export CC="$(pwd)/.ci/zcc"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            goreleaser release --clean
          else
            goreleaser release --clean --snapshot --skip=publish,sign
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WFX_STATIC_LDFLAGS: "-linkmode external -extldflags '-static'"

      - name: Upload snapshot dist
        if: "!startsWith(github.event.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-snapshot
          path: dist/
          retention-days: 1

      - name: Upload snapshot SBOM
        if: "!startsWith(github.event.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-snapshot
          path: ui/*.cyclonedx.sbom.json
          retention-days: 1
