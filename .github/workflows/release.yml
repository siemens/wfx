---
name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ui
      - uses: ./.github/actions/setup-build

      - name: Generate SBOM for ui/
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1.2.0
        with:
          image: ghcr.io/oss-review-toolkit/ort-minimal:latest@sha256:8da0e190af68d710cbf469c22ed1912b2c32cfff0f5de1ff5a87a189de1cfbd0
          project-path: ${{ github.workspace }}/ui
          run: >-
            cache-dependencies,
            analyzer,
            reporter
          report-formats: "CycloneDx"
          ort-cli-report-args: "-O CycloneDX=output.file.formats=json"
      - name: Copy SBOM into ui/
        run: cp "${{ steps.ort.outputs.results-sbom-cyclonedx-json-path }}" ui/ui.cdx.json

      - name: Setup build
        run: sudo .ci/setup-build.sh
      - name: Run GoReleaser
        run: |
          export CC="$(pwd)/.ci/zcc"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            goreleaser release --clean
          else
            goreleaser release --clean --snapshot --skip=publish,sign
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WFX_STATIC_LDFLAGS: "-linkmode external -extldflags '-static'"

      - name: Stage container source
        run: |
          echo "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

          # Sanitize ref and compute tags
          CLEAN_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "IMAGE_VERSION=$CLEAN_REF" >> "$GITHUB_ENV"

          TAGS="$CLEAN_REF ${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAGS="$TAGS latest"
          fi
          echo "IMAGE_TAGS=$TAGS" >> "$GITHUB_ENV"

          mkdir -p source
          cp Dockerfile source/
          for arch in amd64 arm64; do
            mkdir -p "source/dist/${arch}"
            cp -v -p "dist/wfx_linux_${arch}"*/wfx "source/dist/${arch}/wfx"
          done

      - name: Build containers
        id: build_image_multiarch
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ github.repository }}
          tags: ${{ env.IMAGE_TAGS }}
          oci: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
            org.opencontainers.image.name=wfx
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=wfx
            org.opencontainers.image.description=a lightweight, general-purpose workflow executor
          context: ./source
          containerfiles: |
            ./source/Dockerfile

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14
      - name: Install debsbom
        run: |
          python -m pip install --upgrade pip
          pip install debsbom[cdx,download]

      - name: Generating container SBOMs
        env:
          IMAGE: ${{ steps.build_image_multiarch.outputs.image }}
          TAG: ${{ github.sha }}
        run: |
          ARCHES=$(buildah manifest inspect "localhost/${IMAGE}:${TAG}" \
            | jq -r '.manifests[].platform.architecture' | sort -u | tr '\n' ' ')
          echo "ARCHES=$ARCHES" >> "$GITHUB_ENV"

          for ARCH in $ARCHES; do
            buildah unshare bash -c '
              ARCH="'"$ARCH"'"
              container=$(buildah from --arch "$ARCH" "localhost/${IMAGE}:${TAG}")
              mountpoint=$(buildah mount "$container")

              echo "Assembling /var/lib/dpkg/status for $ARCH"
              for f in "$mountpoint"/var/lib/dpkg/status.d/*; do
                if [ -f "$f" ] && grep -q "^Package:" "$f"; then
                  cat "$f"
                  echo ""
                fi
              done > "$mountpoint/var/lib/dpkg/status"

              echo "Generating container-${ARCH}.cdx.json"
              debsbom generate -t cdx \
                --distro-name distroless \
                --distro-arch "$ARCH" \
                --with-licenses \
                --base-distro-vendor debian \
                --root "$mountpoint" \
                --out "container-${ARCH}"

              buildah unmount "$container" || true
              buildah rm "$container" || true
            '
          done

      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to registry
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3
        with:
          image: ${{ steps.build_image_multiarch.outputs.image }}
          tags: ${{ steps.build_image_multiarch.outputs.tags }}
          registry: ghcr.io

      - uses: sigstore/cosign-installer@v4.1.0
      - name: Attest SBOM per architecture
        env:
          IMAGE: ghcr.io/${{ steps.build_image_multiarch.outputs.image }}
          TAG: ${{ github.sha }}
        run: |
          for ARCH in $ARCHES; do
              DIGEST=$(buildah manifest inspect "${IMAGE}:${TAG}" |
                  jq -r --arg a "$ARCH" '.manifests[] | select(.platform.architecture==$a) | .digest')

              # NOTE: cosign auto-detects CI env and uses keyless flow via GitHub OIDC token
              echo "$ARCH: ${IMAGE}@${DIGEST}: attesting container sbom"
              cosign attest --yes --type cyclonedx --predicate "container-${ARCH}.cdx.json" "${IMAGE}@${DIGEST}"
              echo "$ARCH: ${IMAGE}@${DIGEST}: attesting golang sbom"
              cosign attest --yes --type cyclonedx --predicate dist/wfx_*_${ARCH}.cdx.json "${IMAGE}@${DIGEST}"
          done

      - name: Verify SBOM per architecture
        env:
          IMAGE: ghcr.io/${{ steps.build_image_multiarch.outputs.image }}
          TAG: ${{ github.sha }}
        run: |
          for ARCH in $ARCHES; do
              DIGEST=$(buildah manifest inspect "${IMAGE}:${TAG}" |
                  jq -r --arg a "$ARCH" '.manifests[] | select(.platform.architecture==$a) | .digest')

              COUNT=$(cosign verify-attestation \
                  --type cyclonedx \
                  --certificate-identity-regexp '^${{ github.server_url }}/${{ github.repository }}/\.github/workflows/release\.yml@refs/.*$' \
                  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                  "${IMAGE}@${DIGEST}" 2>/dev/null | jq -s 'length')

              if [ "$COUNT" -eq 2 ]; then
                  echo "✅ $ARCH: ${IMAGE}@${DIGEST}: both SBOM attestations verified"
              else
                  echo "❌ $ARCH: ${IMAGE}@${DIGEST}: expected 2 cyclonedx attestations, got $COUNT"
                  exit 1
              fi
          done

      - name: Upload snapshot dist
        if: "!startsWith(github.event.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-snapshot
          path: dist/
          retention-days: 1

      - name: Upload snapshot SBOMs
        if: "!startsWith(github.event.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          retention-days: 1
          path: |
            ui/*.cdx.json
            *.cdx.json
