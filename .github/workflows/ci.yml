---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ui
      - uses: ./.github/actions/setup-build
      - run: sudo .ci/setup-build.sh
      - name: Build Snapshot Release for Linux
        run: /usr/bin/env CC=$(pwd)/.ci/zcc goreleaser release --clean --snapshot
        env:
          WFX_STATIC_LDFLAGS: "-linkmode external -extldflags '-static'"
      - name: Upload Linux AMD64 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-amd64
          path: dist/*amd64*/
          retention-days: 5
      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-arm64
          path: dist/*arm64*/
          retention-days: 5
      - name: Upload UI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-ui
          path: |
            dist/wfxui-*
            dist/*SHA256SUMS
            dist/artifacts.json
            dist/metadata.json
          retention-days: 5

  build-windows:
    name: Build for Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ui
      - uses: ./.github/actions/setup-build
      - run: sudo .ci/setup-build.sh
      # even though Windows is not officially supported, we want it to at least compile successfully
      - run: /usr/bin/env CC="$(pwd)/.ci/zcc" goreleaser build --clean --single-target --snapshot
        env:
          GOOS: windows
          WFX_STATIC_LDFLAGS: "-linkmode external -extldflags '-static'"

  build-contrib:
    name: Build Contrib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
      - run: |
          go build -C contrib/remote-access/client
          go build -C contrib/config-deployment/client

  go-unit-test:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    container: golang:1.27.0@sha256:4013ae0f9e7994f8535c58c811f8f863fbed38b72e0d51e6592156f758d66146
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Golang caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golang-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golang-
      - run: go test -race -coverprofile=coverage2.out -covermode=atomic -timeout 30s --tags=testing ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage*.out

  go-integration-test:
    name: Go Integration Tests
    runs-on: ubuntu-latest
    container: golang:1.27.0@sha256:4013ae0f9e7994f8535c58c811f8f863fbed38b72e0d51e6592156f758d66146
    services:
      mysql:
        image: mysql:8-debian@sha256:49f4fcb0087318aa1c222c7e8ceacbb541cdc457c6307d45e6ee4313f4902e33
        env:
          # see https://hub.docker.com/_/mysql
          MYSQL_DATABASE: wfx
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: wfx
          MYSQL_PASSWORD: secret
          MYSQL_HOST: mysql
        # Set health checks to wait until mysql has started
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          # see https://hub.docker.com/_/postgres
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_DB: wfx
          POSTGRES_USER: wfx
          POSTGRES_PASSWORD: secret
          POSTGRES_HOST_AUTH_METHOD: trust
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      MYSQL_DATABASE: wfx
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: wfx
      MYSQL_PASSWORD: secret
      MYSQL_HOST: mysql
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: wfx
      PGUSER: wfx
      PGPASSWORD: secret
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"
      - name: Setup Golang caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golang-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golang-
      - name: Run integration tests
        run: go test -tags testing,integration -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

      - run: .ci/setup-cli-tests.sh
      - name: install wfx
        run: go install .
      - name: install wfxctl
        run: go install ./cmd/wfxctl
      - name: build plugins
        run: go build -C example/plugin
      - name: Run CLI tests
        working-directory: test
        run: export PATH=$(go env GOPATH)/bin:$PATH; bats .

  lint:
    runs-on: ubuntu-latest
    name: Lint
    container: golang:1.27.0@sha256:4013ae0f9e7994f8535c58c811f8f863fbed38b72e0d51e6592156f758d66146
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create UI embed inputs
        run: mkdir -p ui/dist && touch ui/dist/app.js.zst ui/dist/app.js.sha256 ui/dist/app.css.zst ui/dist/app.css.sha256 ui/dist/logo.svg.zst
      - run: .ci/setup-lint.sh
      - name: Disable git security features
        run: git config --global safe.directory '*'
      - run: just lint

  format:
    runs-on: ubuntu-latest
    name: Format
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run biome
        uses: docker://ghcr.io/biomejs/biome:2.5.11@sha256:093bd40aab34a7dbe0a50acbf5e27046f34920e17a882e80c8fc41a13d3ad67f
        with:
          args: ci
      - name: Run gofumpt
        uses: docker://golang:1.27.0@sha256:4013ae0f9e7994f8535c58c811f8f863fbed38b72e0d51e6592156f758d66146
        with:
          args: go tool -modfile=tools/go.mod mvdan.cc/gofumpt -d -e .

  reuse:
    runs-on: ubuntu-latest
    name: Reuse
    container: fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: reuse lint

  generate:
    name: Generate Code
    runs-on: ubuntu-latest
    container: golang:1.27.0@sha256:4013ae0f9e7994f8535c58c811f8f863fbed38b72e0d51e6592156f758d66146
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages
        run: .ci/setup-generate.sh
      - name: Disable git security features
        run: git config --global safe.directory '*'
      - run: just generate
      - run: git diff --exit-code

  openapi-check-breaking:
    name: API check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for breaking changes in API
        id: breaking_changes
        uses: oasdiff/oasdiff-action/breaking@54d7a752569cb30b644b7f27a362c1077973d1c0 # v0.1.14
        with:
          base: https://raw.githubusercontent.com/siemens/wfx/refs/heads/main/spec/wfx.openapi.yml
          revision: spec/wfx.openapi.yml
          fail-on: ERR

  ui-unit-tests:
    name: UI Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ui

      # Gleam
      - name: Test
        run: |
          gleam test
          npm test
        working-directory: ui
      - name: Format
        run: gleam format --check src test
        working-directory: ui
      - name: Build
        run: gleam run -m lustre/dev build --minify
        working-directory: ui

      # Go
      - uses: ./.github/actions/setup-build
      - run: go generate -tags ui ./ui
      - run: go test -race -coverprofile=coverage1.out -covermode=atomic -timeout 30s --tags=testing,ui ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage1.out

  ui-integration-tests:
    name: UI Integration Tests
    runs-on: ubuntu-latest
    env:
      ImageOS: ubuntu24
    container:
      # the tag must track the @playwright/test version resolved in ui/integration/package-lock.json
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ui
      - uses: ./.github/actions/setup-build
      - name: Build wfx with embedded UI
        env:
          CGO_ENABLED: 1
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -q
          apt-get install -q -y --no-install-recommends zstd libsqlite3-dev gcc
          (cd ui && gleam run -m lustre/dev build --minify)
          go generate -tags ui ./ui
          go build -tags ui,no_mysql,no_postgres,libsqlite3 -o /usr/local/bin/wfx .

      - name: Install dependencies
        run: npm ci
        working-directory: ui/integration

      - name: Run Playwright tests
        run: |
          export HOME=/root
          mkdir -p $HOME
          npx playwright test --project chromium --project firefox --project webkit --reporter=list,html
        working-directory: ui/integration

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ui/integration/playwright-report/
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: ui/integration/test-results/
          retention-days: 1
          if-no-files-found: ignore
