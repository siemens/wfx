# Exclude query strings so OAuth callback codes aren't written to logs.
log_format wfx '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
access_log /dev/stdout wfx;
error_log /dev/stderr;

# Map request and auth-claim values to flags used by authorization checks below.
map "$request_method:$oauth_scope" $scope_authorized {
    # deny by default
    default 0;
    # Allow GET/HEAD with read or write scope
    "~^(?:GET|HEAD):(?:.*[, ])?(?:read|write):jobs(?:[, ].*)?$" 1;
    # require write scope for modifying methods.
    "~^(?:POST|PUT|PATCH|DELETE):(?:.*[, ])?write:jobs(?:[, ].*)?$" 1;
}

# Detect membership in the wfx admin group.
map $wfx_groups $is_wfx_admin_group {
    default 0;
    # Match the complete `wfx` group in comma- or space-separated claims.
    "~(?:^|[, ])wfx(?:[, ]|$)" 1;
}

# Detect requests authenticated as the wfxctl OIDC client.
map $wfx_oidc_client_id $is_wfxctl_client {
    default 0;
    "~^wfxctl$" 1;
}

# Allow management access to wfx admins or the wfxctl client.
map "$is_wfx_admin_group:$is_wfxctl_client" $management_authorized {
    default 0;
    # Allow any request from a member of the WFX admin group.
    "~^1:" 1;
    # Also allow the wfxctl client, regardless of group membership.
    "~:1$" 1;
}

# Northbound management API and UI server.
server {
    listen 8443 ssl;
    server_name wfx-mgmt.localhost;

    ssl_certificate @STATE@/certs/cert.pem;
    ssl_certificate_key @STATE@/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_ignore_headers X-Accel-Redirect;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Redirect $scheme://$host:$server_port$request_uri;
    }

    location = /_oauth2_auth {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # oauth2-proxy redirects here from the token's aud claim; allow northbound API audience only.
    location = /_token_audience/wfx-northbound-api {
        internal;
        return 204;
    }

    # Reject X-Accel-Redirects for all other audiences.
    location ^~ /_token_audience/ {
        internal;
        return 403 "Forbidden: Token audience mismatch";
    }

    # fallback: block unknown API routes
    location /api/ {
        return 403 "Forbidden: Unknown API endpoint";
    }

    # public endpoints
    location = /health {
        try_files $uri @northbound;
    }
    location = /version {
        try_files $uri @northbound;
    }
    location ~ ^/api/wfx/v1/(health|version|openapi.json|swagger.json)$ {
        try_files $uri @northbound;
    }

    location /api/wfx/v1/workflows {
        # Authorize through an internal subrequest: 2xx allows; 401/403 deny.
        auth_request /_oauth2_auth;
        error_page 403 = @forbidden;
        # Capture scope for method authorization.
        auth_request_set $oauth_scope $upstream_http_x_oauth_scope;
        # Capture groups for admin authorization.
        auth_request_set $wfx_groups $upstream_http_x_wfx_groups;
        # Capture client ID for management authorization.
        auth_request_set $wfx_oidc_client_id $upstream_http_x_wfx_oidc_client_id;
        # Hand off to the named location for management and scope checks.
        try_files $uri @northbound_authorized;
    }

    location /api/wfx/v1/jobs {
        # Authorize through an internal subrequest: 2xx allows; 401/403 deny.
        auth_request /_oauth2_auth;
        error_page 403 = @forbidden;
        # Capture scope for method authorization.
        auth_request_set $oauth_scope $upstream_http_x_oauth_scope;
        # Capture groups for admin authorization.
        auth_request_set $wfx_groups $upstream_http_x_wfx_groups;
        # Capture client ID for management authorization.
        auth_request_set $wfx_oidc_client_id $upstream_http_x_wfx_oidc_client_id;
        # Hand off to the named location for management and scope checks.
        try_files $uri @northbound_authorized;
    }

    location = / {
        return 302 /ui/;
    }

    location = /ui {
        return 302 /ui/;
    }

    location /ui/ {
        alias @UI_DIST@/;
        try_files $uri $uri/ /ui/index.html;
    }

    # fallback: block all routes
    location / {
        return 403 "Forbidden: Unknown endpoint";
    }

    location @northbound {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-Id "";
    }

    location @northbound_authorized {
        # Claims captured in the protected locations feed these authorization maps.
        if ($management_authorized = 0) {
            return 403 "Forbidden: Admin group required";
        }
        if ($scope_authorized = 0) {
            return 403 "Forbidden: Invalid scope for this HTTP method";
        }
        # Authorization checks passed; forward the request to the northbound API.
        try_files $uri @northbound;
    }

    location @forbidden {
        return 403 "Forbidden: Access denied";
    }
}

# Southbound API server.
server {
    listen 8443 ssl;
    server_name wfx.localhost;

    ssl_certificate @STATE@/certs/cert.pem;
    ssl_certificate_key @STATE@/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /_oauth2_auth {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # oauth2-proxy redirects here from the token's aud claim; allow southbound API audience only.
    location = /_token_audience/wfx-southbound-api {
        internal;
        return 204;
    }

    # Reject X-Accel-Redirects for all other audiences.
    location ^~ /_token_audience/ {
        internal;
        return 403 "Forbidden: Token audience mismatch";
    }

    # fallback: block all routes
    location / {
        return 403 "Forbidden: Unknown endpoint";
    }

    # public endpoints
    location = /health {
        try_files $uri @southbound;
    }
    location = /version {
        try_files $uri @southbound;
    }
    location ~ ^/api/wfx/v1/(health|version|openapi.json|swagger.json)$ {
        try_files $uri @southbound;
    }

    location /api/wfx/v1/workflows {
        return 403 "Forbidden: Workflows endpoint disabled";
    }

    # device-specific: JWT + device claim + jobs scope
    location /api/wfx/v1/jobs {
        # Authorize through an internal subrequest: 2xx allows; 401/403 deny.
        auth_request /_oauth2_auth;
        error_page 403 = @forbidden;
        # Capture device claim from the auth response for device binding.
        auth_request_set $device_id $upstream_http_x_wfx_device_id;
        # Capture granted scopes from the auth response for method authorization.
        auth_request_set $oauth_scope $upstream_http_x_oauth_scope;
        # Hand off to the named location for device and scope checks.
        try_files $uri @southbound_jobs;
    }

    location @southbound_jobs {
        # $device_id and $oauth_scope come from auth response headers; $scope_authorized maps method + scope.
        if ($device_id = "") {
            return 403 "Forbidden: No device ID in token";
        }
        if ($scope_authorized = 0) {
            return 403 "Forbidden: Invalid scope for this HTTP method";
        }
        # Authorization checks passed; forward the request to the southbound API.
        try_files $uri @southbound;
    }

    location @southbound {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-Id $device_id;
    }

    location @forbidden {
        return 403 "Forbidden: Access denied";
    }
}

# TLS-terminating reverse proxy for local Authelia; not needed for external OIDC providers (e.g. Auth0).
server {
    listen 8443 ssl;
    server_name authelia.localhost;

    ssl_certificate @STATE@/certs/cert.pem;
    ssl_certificate_key @STATE@/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        add_header Access-Control-Allow-Origin "https://wfx-mgmt.localhost:8443" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:9091;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto https;
    }
}
